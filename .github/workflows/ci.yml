name: CI

# Quality gate — runs on every push/PR, separate from the operational translate/scan workflows.
# Jobs: (1) test suite with coverage, (2) secret & env-dump scan.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest-cov

      # The config-presence tests read these from the environment. In CI there is no
      # .env, so we inject NON-SECRET placeholders (never real credentials) purely to
      # satisfy the "is it set / well-formed" assertions in test_config.py.
      - name: Run tests with coverage
        env:
          PROFESSIONALIZE_BASE_URL: http://ci.local
          PROFESSIONALIZE_LLM_MODEL: ci-test-model
          METRICS_WEBHOOK_URL_TEAM: http://ci.local
          METRICS_TOKEN_TEAM: ci-test-token
          METRICS_API_KEY: ci-test-key
        run: |
          python -m pytest -q \
            --cov=tools --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=35
          # Baseline ~38%. Ratchet this number up as tests are added (next targets:
          # translator.py chunking/retry paths, io_google_spreadsheet, scan_missing_translations).

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  secret-scan:
    name: Secret & env-dump scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Block CI env-dumps and hardcoded secrets in tracked source
        run: |
          set -euo pipefail
          fail=0

          # 1. No workflow may reintroduce an environment dump (run: env)
          if git grep -nE '^[[:space:]]*run:[[:space:]]*env[[:space:]]*$' -- '.github/workflows/*.yml'; then
            echo "::error::A workflow runs 'env' (dumps all environment variables to logs). Remove it."
            fail=1
          fi

          # 2. No hardcoded secret-like strings in tracked source
          if git grep -nE 'AIza[0-9A-Za-z_-]{10,}|sk-[A-Za-z0-9]{16,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|\?token=[A-Za-z0-9]' \
               -- '*.py' '*.ts' '*.tsx' '*.mjs' '*.yml' ':!*.lock' ':!*.example'; then
            echo "::error::Possible hardcoded secret in tracked source. Move it to an env var / GitHub secret."
            fail=1
          fi

          if [ "$fail" -eq 0 ]; then
            echo "OK — no env-dumps or hardcoded secrets found in tracked files."
          fi
          exit "$fail"

  # Optional history-aware scanner (org use needs GITLEAKS_LICENSE):
  # gitleaks:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #       with: { fetch-depth: 0 }
  #     - uses: gitleaks/gitleaks-action@v2
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
